name: Build desktop admin (Windows)

# A Windows installer must be produced on Windows, so the build runs here
# rather than locally. Trigger it by hand, or by pushing a `desktop-v*` tag.
on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  build:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:win

      - uses: actions/upload-artifact@v4
        with:
          name: KuenphenAdmin-Windows-Installer
          path: desktop/dist/*.exe
          if-no-files-found: error

      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/*.exe
