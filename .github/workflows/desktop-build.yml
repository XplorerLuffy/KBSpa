name: Build desktop admin (Windows)

# A Windows installer must be produced on Windows, so the build runs here
# rather than locally. Trigger it by hand, or by pushing a `desktop-v*` tag.
on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  build:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:win

      - uses: actions/upload-artifact@v4
        with:
          name: KuenphenAdmin-Windows-Installer
          path: |
            desktop/dist/*.exe
            desktop/dist/*.exe.blockmap
            desktop/dist/latest.yml
          if-no-files-found: error

      # latest.yml and the .blockmap must ship alongside the installer: they
      # are the update feed electron-updater reads from this release to know
      # a newer version exists and where to fetch it (the .blockmap enables
      # a differential download instead of re-fetching the whole installer).
      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.exe
            desktop/dist/*.exe.blockmap
            desktop/dist/latest.yml
