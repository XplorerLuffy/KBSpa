appId: com.kuenphenbeautyspa.admin
productName: Kuenphen Admin
copyright: Kuenphen Beauty Spa

# Tells electron-builder where the update feed lives, so it (a) embeds
# resources/app-update.yml into the packaged app for electron-updater to read
# at runtime, and (b) generates dist/latest.yml alongside the installer. The
# CI workflow uploads both the installer and latest.yml to the GitHub Release
# it creates; electron-updater never publishes anything itself here (the
# build script always runs with --publish never).
publish:
  provider: github
  owner: XplorerLuffy
  repo: KBSpa
  releaseType: release

directories:
  output: dist
  buildResources: build

files:
  - src/**/*
  - build/icon.png
  - package.json
  - "!**/*.map"

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  # Unsigned builds trigger a SmartScreen warning on first run. See README for
  # how to point this at a real code-signing certificate.
  signAndEditExecutable: true

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Kuenphen Admin
  artifactName: KuenphenAdmin-Setup-${version}.${ext}
